<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004fb6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009e7a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#grad)" filter="url(#shadow)" />
  <!-- Stylized Letter 'A' -->
  <text x="50%" y="65%" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">A</text>
</svg>
